<section class="tst section-tight section-canvas" id="testimonials">
  <div class="container tst__grid">
    <div class="tst__aside elev-card" appReveal="left">
      <p class="eyebrow">Testimonials</p>
      <h2 class="display-md">What Clients<br />Say</h2>
      <p class="lead tst__lead">
        Feedback from businesses across Colombo and beyond.
      </p>

      <div class="tst__nav" role="group" aria-label="Browse testimonials">
        <button type="button" class="tst__btn" (click)="prev()" aria-label="Previous testimonial">
          <span aria-hidden="true">←</span>
        </button>
        <span class="tst__counter" aria-live="polite">{{ counter }}</span>
        <button type="button" class="tst__btn tst__btn--primary" (click)="next()" aria-label="Next testimonial">
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </div>

    <figure
      class="tst__quote elev-card"
      appReveal="right reveal-delay-2"
      [attr.data-dir]="direction()"
    >
      <div class="tst__stage" [attr.data-dir]="direction()">
        @for (item of items; track item.id; let i = $index) {
          @if (i === index()) {
            <div class="tst__slide" [attr.data-key]="animKey()">
              <span class="tst__mark" aria-hidden="true">“</span>
              <blockquote>{{ item.quote }}</blockquote>
              <figcaption>
                <strong>{{ item.name }}</strong>
                <span>{{ item.role }} · {{ item.company }}</span>
              </figcaption>
              <span class="cmyk-rule tst__rule" aria-hidden="true"></span>
            </div>
          }
        }
      </div>
    </figure>
  </div>
</section>

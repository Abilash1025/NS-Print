<section class="fin section section-canvas" id="finishes">
  <div class="container">
    <div class="head-split" appReveal>
      <div>
        <p class="eyebrow">Materials & finishes</p>
        <h2 class="display-md">Every Detail Matters</h2>
      </div>
      <p class="lead">
        Switch a finish to see the surface change — matte, gloss, foil, or emboss.
      </p>
    </div>

    <div class="fin__stage elev-card" [attr.data-finish]="activeId()" appReveal="scale">
      <div class="fin__sample">
        <div class="fin__card" [attr.data-wipe]="wipeKey()">
          <img
            class="fin__paper"
            [src]="active.image"
            [alt]="'NS Print Mart ' + active.label + ' finish sample'"
            loading="lazy"
          />
          <span class="fin__sheen" aria-hidden="true"></span>
          <span class="fin__glow" aria-hidden="true"></span>
          <span class="fin__wipe" aria-hidden="true"></span>
          <span class="fin__stamp num-label">{{ active.label }}</span>
        </div>
        <div class="fin__specs" aria-hidden="true">
          <span>SURFACE</span>
          <span>{{ active.label }}</span>
        </div>
      </div>

      <div class="fin__picker" role="tablist" aria-label="Finish options">
        @for (finish of finishes; track finish.id; let i = $index) {
          <button
            type="button"
            role="tab"
            class="fin__opt"
            [class.is-active]="activeId() === finish.id"
            [attr.aria-selected]="activeId() === finish.id"
            (click)="select(finish.id)"
          >
            <span class="fin__opt-num num-label">0{{ i + 1 }}</span>
            <span class="fin__opt-body">
              <span class="fin__opt-label">{{ finish.label }}</span>
              <span class="fin__opt-desc">{{ finish.description }}</span>
            </span>
          </button>
        }
      </div>
    </div>
  </div>
</section>

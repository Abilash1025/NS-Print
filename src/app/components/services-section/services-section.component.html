<section class="services section section-canvas" id="services">
  <div class="container">
    @if (showHeader()) {
      <div class="head-split" appReveal>
        <div>
          <p class="eyebrow">Services</p>
          <h2 class="display-md">What Can We Print For You?</h2>
        </div>
        <p class="lead">
          Twelve print categories — tap a card for details and a quote request.
        </p>
      </div>
    }

    <div class="services__grid" appReveal="stagger">
      @for (service of services; track service.id; let i = $index) {
        <button
          type="button"
          class="srv anim-card"
          [style.--i]="i"
          (click)="open(service)"
        >
          <span class="anim-card__shine" aria-hidden="true"></span>

          <span class="srv__img">
            <picture>
              <source [srcset]="service.image" type="image/webp" />
              <img
                [src]="pngSrc(service.image)"
                [alt]="service.name"
                width="640"
                height="480"
                loading="lazy"
                decoding="async"
              />
            </picture>
            <span class="srv__marks" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
            <span class="srv__badge">{{ service.id }}</span>
          </span>

          <span class="srv__body">
            <span class="srv__meta">
              <span class="srv__cat">{{ service.categoryLabel }}</span>
              <span class="srv__arrow" aria-hidden="true">
                <span>→</span>
              </span>
            </span>
            <h3>{{ service.name }}</h3>
            <p>{{ service.shortDescription }}</p>
          </span>
        </button>
      }
    </div>
  </div>

  @if (selected(); as service) {
    <app-service-modal [service]="service" (closed)="close()" />
  }
</section>

<section class="featured section section-canvas" id="featured">
  <div class="container">
    <div class="head-split" appReveal>
      <div>
        <p class="eyebrow">Featured print</p>
        <h2 class="display-md">Made to Be Seen.<br />Made to Last.</h2>
      </div>
      <p class="lead">
        Real stocks, real finishes — request a quote for any product below.
      </p>
    </div>

    <div class="bento" appReveal="stagger">
      @for (product of products; track product.id; let i = $index) {
        <article class="bento__item anim-card" [attr.data-size]="product.size">
          <span class="anim-card__shine" aria-hidden="true"></span>
          <div class="bento__img anim-card__media">
            <img [src]="product.image" [alt]="product.name" loading="lazy" />
          </div>
          <div class="bento__body">
            <div class="bento__bar">
              <h3>{{ product.name }}</h3>
              <a href="#quote" class="bento__req">Request →</a>
            </div>
            <p>{{ product.description }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>

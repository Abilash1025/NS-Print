<section class="proc section" id="process">
  <div class="container">
    <div class="proc__intro" appReveal>
      <p class="eyebrow">How it works</p>
      <h2 class="display-md">From Idea to Print</h2>
      <p class="lead">Four clear steps — you always know where your job is.</p>
    </div>

    <div class="proc__board elev-card" appReveal>
      <div class="proc__rail" aria-hidden="true">
        <span class="proc__rail-fill"></span>
      </div>

      <ol class="proc__steps" appReveal="stagger">
        @for (step of steps; track step.id; let i = $index) {
          <li class="proc__step">
            <div class="proc__ink" [attr.data-ink]="i">
              <span>{{ step.number }}</span>
            </div>
            <h3>{{ step.title }}</h3>
            <p>{{ step.description }}</p>
            @if (i < steps.length - 1) {
              <span class="proc__arrow" aria-hidden="true">→</span>
            }
          </li>
        }
      </ol>
    </div>
  </div>
</section>

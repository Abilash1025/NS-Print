<div
  class="modal"
  [class.is-visible]="visible()"
  [class.is-closing]="closing()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="service().name"
  (click)="onBackdrop($event)"
>
  <div class="modal__panel" (click)="$event.stopPropagation()">
    <button type="button" class="modal__close" (click)="close()" aria-label="Close">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <div class="modal__hero">
      <picture>
        <source [srcset]="service().image" type="image/webp" />
        <img
          [src]="pngSrc(service().image)"
          [alt]="service().name"
          width="960"
          height="540"
        />
      </picture>
      <div class="modal__hero-shade" aria-hidden="true"></div>
      <div class="modal__hero-meta">
        <span class="modal__chip">{{ service().id }}</span>
        <span class="modal__chip modal__chip--light">{{ service().categoryLabel }}</span>
      </div>
    </div>

    <div class="modal__content">
      <header class="modal__head">
        <p class="eyebrow">Service detail</p>
        <h2 class="modal__title">{{ service().name }}</h2>
        <p class="modal__desc">{{ service().description }}</p>
      </header>

      <ul class="modal__tags" aria-label="What's included">
        @for (feature of service().features; track feature) {
          <li>{{ feature }}</li>
        }
      </ul>

      <section class="modal__quote">
        <div class="modal__quote-head">
          <h3>Request a quote</h3>
          <p>Quantity, size, and finish — we’ll reply with details.</p>
        </div>
        <app-quote-form />
      </section>
    </div>
  </div>
</div>

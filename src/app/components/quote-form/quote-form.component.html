<div class="quote">
  @if (submitted()) {
    <div class="quote__success" role="status">
      <h3>WhatsApp is opening with your quote request.</h3>
      <p>
        Send the message to finish — if WhatsApp did not open, use the button below or call us.
      </p>
      <button type="button" class="btn btn-primary" (click)="resetSuccess()">Send another request</button>
    </div>
  } @else {
    <form class="quote__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="quote__grid">
        <label>
          <span>Name *</span>
          <input type="text" formControlName="name" autocomplete="name" />
          @if (hasError('name')) {
            <small>Please enter your name.</small>
          }
        </label>
        <label>
          <span>Company</span>
          <input type="text" formControlName="company" autocomplete="organization" />
        </label>
        <label>
          <span>Email *</span>
          <input type="email" formControlName="email" autocomplete="email" />
          @if (hasError('email')) {
            <small>Enter a valid email.</small>
          }
        </label>
        <label>
          <span>Phone *</span>
          <input type="tel" formControlName="phone" autocomplete="tel" />
          @if (hasError('phone')) {
            <small>Enter a valid phone number.</small>
          }
        </label>
        <label>
          <span>What do you need? *</span>
          <select formControlName="service">
            <option value="" disabled>Select a product / service</option>
            @for (service of services; track service.id) {
              <option [value]="service.slug">{{ service.name }}</option>
            }
          </select>
          @if (hasError('service')) {
            <small>Select a service.</small>
          }
        </label>
        <label>
          <span>Quantity</span>
          <input type="text" formControlName="quantity" placeholder="e.g. 500" />
        </label>
        <label class="span-2">
          <span>Preferred deadline</span>
          <input type="text" formControlName="deadline" placeholder="e.g. 20 April" />
        </label>
        <label class="span-2">
          <span>Message *</span>
          <textarea rows="4" formControlName="message" placeholder="Sizes, finishes, artwork notes…"></textarea>
          @if (hasError('message')) {
            <small>Please add a short message.</small>
          }
        </label>
      </div>
      <button type="submit" class="btn btn-primary">Send on WhatsApp</button>
      <p class="quote__note">
        Your details open in WhatsApp so we can reply quickly with a quote.
      </p>
    </form>
  }
</div>
